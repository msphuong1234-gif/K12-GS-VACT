<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNIT-6 • K12 GS V-ACT</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#17324d}
.wrap{max-width:920px;margin:auto;padding:28px 16px} .top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.back{color:#315f8a;text-decoration:none;font-weight:700} h1{margin:12px 0 4px;font-size:clamp(28px,5vw,42px)}
.sub,.status{color:#718397}.search{width:100%;padding:14px 16px;border:1px solid #dce5ef;border-radius:14px;font-size:16px;margin:18px 0}
.list{display:grid;gap:12px}.lesson{display:block;background:#fff;color:inherit;text-decoration:none;border:1px solid #e1e9f2;border-radius:16px;padding:18px;box-shadow:0 5px 15px rgba(0,0,0,.06)}
.lesson:hover{transform:translateY(-2px)}.lesson-title{font-size:18px;font-weight:700}.filename{font-size:12px;color:#8a99a8;margin-top:6px;word-break:break-all}
.empty{padding:24px;background:#fff;border-radius:16px;text-align:center;color:#718397}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a class="back" href="../">← Trang chính</a><span class="status" id="count"></span></div>
<h1>UNIT 6</h1><div class="sub">Danh sách bài học được tự động đọc từ GitHub</div>
<input id="search" class="search" placeholder="Tìm Lesson...">
<div id="status" class="status">Đang đọc danh sách bài học...</div>
<div id="list" class="list"></div>
</div>
<script>
const OWNER="msphuong1234-gif", REPO="K12-GS-VACT", BRANCH="main", UNIT="UNIT-6";
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(UNIT)}?ref=${encodeURIComponent(BRANCH)}`;
const list=document.getElementById('list'), search=document.getElementById('search'), statusEl=document.getElementById('status'), countEl=document.getElementById('count');
let lessons=[];
function lessonNo(name){
  const m=name.match(/lesson[_\- ]?(\d+)/i); return m?parseInt(m[1]):999;
}
function niceName(name){
  const no=lessonNo(name);
  if(no!==999) return `LESSON ${no}`;
  return name.replace(/\.html?$/i,'').replace(/[_-]+/g,' ');
}
async function load(){
  try{
    const r=await fetch(API,{headers:{'Accept':'application/vnd.github+json'}});
    if(!r.ok) throw new Error(r.status);
    const data=await r.json();
    lessons=data.filter(x=>x.type==='file' && /\.html?$/i.test(x.name) && x.name.toLowerCase()!=='index.html')
                .sort((a,b)=>lessonNo(a.name)-lessonNo(b.name) || a.name.localeCompare(b.name));
    statusEl.textContent='';
    countEl.textContent=`${lessons.length} bài`;
    render();
  }catch(e){
    statusEl.textContent='Không đọc được danh sách GitHub lúc này. Hãy tải lại trang sau ít phút.';
  }
}
function render(){
  const q=search.value.trim().toLowerCase();
  list.innerHTML='';
  const shown=lessons.filter(x=>!q || x.name.toLowerCase().includes(q) || niceName(x.name).toLowerCase().includes(q));
  if(!shown.length){ list.innerHTML='<div class="empty">Chưa có bài học phù hợp.</div>'; return; }
  shown.forEach(x=>{
    const a=document.createElement('a'); a.className='lesson'; a.href=encodeURIComponent(x.name).replace(/%2F/g,'/');
    a.innerHTML=`<div class="lesson-title">${niceName(x.name)} →</div><div class="filename">${x.name}</div>`;
    list.appendChild(a);
  });
}
search.addEventListener('input',render);
load();
</script>
</body>
</html>
