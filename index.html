<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K12 • Global Success • V-ACT</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#17324d}
    .wrap{max-width:1000px;margin:auto;padding:36px 18px}
    header{text-align:center;margin-bottom:28px}
    h1{margin:0 0 8px;font-size:clamp(28px,5vw,46px)}
    .sub{color:#60758a;font-size:17px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
    a.card{display:block;text-decoration:none;color:inherit;background:white;border-radius:18px;
      padding:22px;box-shadow:0 6px 20px rgba(0,0,0,.08);border:1px solid #e4ebf3;
      transition:.15s}
    a.card:hover{transform:translateY(-3px);box-shadow:0 10px 25px rgba(0,0,0,.12)}
    .unit{font-size:22px;font-weight:700}
    .hint{margin-top:8px;color:#718397;font-size:14px}
    footer{text-align:center;color:#8291a1;margin-top:30px;font-size:13px}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>K12 • GS • V-ACT</h1>
    <div class="sub">Chọn Unit để bắt đầu học và luyện tập</div>
  </header>

  <main class="grid">
    <a class="card" href="UNIT-1/"><div class="unit">UNIT 1</div><div class="hint">Mở Unit 1 →</div></a>
    <a class="card" href="UNIT-2/"><div class="unit">UNIT 2</div><div class="hint">Mở Unit 2 →</div></a>
    <a class="card" href="UNIT-3/"><div class="unit">UNIT 3</div><div class="hint">Mở Unit 3 →</div></a>
    <a class="card" href="UNIT-4/"><div class="unit">UNIT 4</div><div class="hint">Mở Unit 4 →</div></a>
    <a class="card" href="UNIT-5/"><div class="unit">UNIT 5</div><div class="hint">Mở Unit 5 →</div></a>
    <a class="card" href="UNIT-6/"><div class="unit">UNIT 6</div><div class="hint">Mở Unit 6 →</div></a>
    <a class="card" href="UNIT-7/"><div class="unit">UNIT 7</div><div class="hint">Mở Unit 7 →</div></a>
    <a class="card" href="UNIT-8/"><div class="unit">UNIT 8</div><div class="hint">Mở Unit 8 →</div></a>
    <a class="card" href="UNIT-9/"><div class="unit">UNIT 9</div><div class="hint">Mở Unit 9 →</div></a>
  </main>

  <footer>Grade 12 • Global Success • V-ACT</footer>
</div>
</body>
</html>
