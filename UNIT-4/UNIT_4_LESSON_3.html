<html lang="vi">
<head>

<title>UNIT 4 • URBANISATION • LESSON 3 • READING — Ôn bài cũ • Luyện tập • Củng cố</title>
<style>:root{--navy:#17324d;--blue:#2563eb;--sky:#eaf3ff;--ink:#172033;--muted:#657087;--line:#d9e2ef;--green:#15803d;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:var(--ink);font:17px/1.65 "Times New Roman",Times,serif}
header{background:linear-gradient(135deg,#102a43,#245b8f);color:#fff;padding:30px 18px}
.wrap{max-width:1060px;margin:auto}
h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px)}.subtitle{opacity:.92;font-size:18px}
.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 14px #0f172a12}
.toolbar .wrap{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap;font-family:system-ui}
.timer{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;font-family:system-ui}
.primary{background:var(--blue);color:#fff}.ghost{background:#eef3f8;color:var(--navy)}.danger{background:#fee2e2;color:#991b1b}
main{padding:22px 14px 60px}
.part-head{margin:34px 0 14px;padding:16px 18px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#17324d,#2b6cb0)}
.part-head h2{margin:0;font-size:24px}.part-head p{margin:4px 0 0;opacity:.9}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:0 0 18px;box-shadow:0 7px 22px #1e293b0b}
.sec-title{margin:26px 0 12px;padding:12px 16px;border-left:6px solid var(--blue);background:var(--sky);border-radius:10px;font-size:20px}
.passage{background:#fbfdff;border:1px solid #bfd3ea;border-radius:14px;padding:16px 18px;margin:12px 0;text-align:justify}
.q{border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:12px 0;background:#fff}
.q.correct{border-color:#86efac;background:#f0fdf4}.q.incorrect{border-color:#fca5a5;background:#fff7f7}.q.nr{border-color:#fcd34d;background:#fffbeb}
.qnum{display:inline-flex;min-width:36px;height:28px;align-items:center;justify-content:center;border-radius:8px;background:#e8eef7;color:var(--navy);font-weight:800;margin-right:8px}
.prompt{font-weight:700}
.options{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:10px 12px;border-radius:10px;cursor:pointer;background:#fff}
.opt:hover{border-color:#7da7df;background:#f8fbff}.opt input{margin-top:5px}
.result{display:none}
.score-big{font-size:44px;font-weight:900;color:var(--navy)}
.badge{display:inline-block;border-radius:99px;padding:6px 14px;font-weight:800;font-family:system-ui;font-size:14px}
.GREEN{background:#dcfce7;color:var(--green)}.AMBER{background:#fef3c7;color:var(--amber)}.RED{background:#fee2e2;color:var(--red)}
.TAG{background:#e0e7ff;color:#3730a3}
.expl{margin-top:10px;padding:12px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
.expl b.hd{color:var(--navy)}
.kb{margin-top:8px;padding:10px 12px;background:#fffbeb;border-left:4px solid var(--amber);border-radius:8px}
.footer-note{color:var(--muted);font-size:14px}
table.vocab{width:100%;border-collapse:collapse;margin:12px 0}
table.vocab th{background:var(--navy);color:#fff;padding:10px 12px;text-align:left}
table.vocab td{border:1px solid var(--line);padding:9px 12px;vertical-align:top}
table.vocab tr:nth-child(even) td{background:#f8fafc}
.know{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:14px 16px;margin:12px 0}
.know b.t{color:var(--green)}
.modal{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.open{display:flex}.modal-box{background:#fff;border-radius:16px;max-width:540px;width:100%;padding:22px;font-family:system-ui}
@media(max-width:760px){.toolbar button{flex:1}}

#gate{position:fixed;inset:0;background:linear-gradient(135deg,#102a43,#245b8f);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.gate-box{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:30px 26px;text-align:center;box-shadow:0 20px 60px #0006}
.gate-box h2{color:var(--navy);margin:0 0 6px}
.gate-box input{width:100%;padding:12px;border:1px solid #bfcadd;border-radius:10px;font-size:17px;margin:12px 0;font-family:system-ui}
.gate-box .primary{width:100%;font-size:17px}
#pwmsg{color:var(--red);font-weight:700;min-height:24px;font-family:system-ui}
.view{display:none}.view.active{display:block}
.backbar{margin:0 0 12px}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:8px}
.hub-card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:22px 18px;cursor:pointer;text-align:left;font-family:"Times New Roman",Times,serif;box-shadow:0 7px 22px #1e293b0b}
.hub-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.hub-card b.t{font-size:21px;color:var(--navy);display:block;margin-bottom:6px}
.hub-card span.d{color:var(--muted);font-size:15px;display:block}
.hub-card .st{margin-top:10px;display:block}
.twopane{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;align-items:start;margin:12px 0}
.pane{max-height:74vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.pane-l{background:#fbfdff}
@media(max-width:860px){.twopane{grid-template-columns:1fr}.pane{max-height:none;overflow:visible}}

@media print{header,.toolbar,.actions{display:none!important}body{background:#fff}.card,.q{box-shadow:none;break-inside:avoid}}</style></head>

ns for residents.", "why": "Trích dẫn: “Density describes concentration, not the quality of the connections within that concentration” (đoạn 1). Ý chính đoạn 1: mật độ đơn thuần không giải thích được hiệu quả khu dân cư.", "distractors": ["B. “normally better” tuyệt đối.", "A. “most reliable” tuyệt đối.", "C. “only factor” tuyệt đối."], "kb": "Main idea đoạn = câu luận điểm.", "authored": false}, {"n": 17, "uid": 17, "part": "PART 4 – READING 2 – DENSITY IS NOT DESTINY", "hd_fix": false, "prompt": "According to paragraph 2, when can higher density help support frequent public transport?", "options": ["When residents are required to use public transport instead of private vehicles.", "When shops and schools are moved away from densely populated neighbourhoods.", "When housing grows faster than transport and utility capacity.", "When enough potential users live close to a transport route."], "keyLetter": "D", "keyText": "When enough potential users live close to a transport route.", "why": "Trích dẫn: “When enough people live near a transport route, frequent service may become economically practical” (đoạn 2).", "distractors": ["C. “grows faster than capacity” là vấn đề, không phải điều kiện.", "A. “required to use” — bài không nói.", "B. “moved away” ngược ý."], "kb": "Detail: đối chiếu nguyên văn.", "authored": false}, {"n": 18, "uid": 18, "part": "PART 4 – READING 2 – DENSITY IS NOT DESTINY", "hd_fix": false, "prompt": "Which statement best reflects the writer’s view of density?", "options": ["It is generally harmful because more residents inevitably create severe congestion.", "Its effects depend on how density interacts with services, infrastructure and urban design.", "It is generally beneficial because concentration automatically improves accessibility.", "It should be reduced in every city where residents must travel to work or school."], "keyLetter": "B", "keyText": "Its effects depend on how density interacts with services, infrastructure and urban design.", const PASSAGES={"READING 1": "<p><b>1.</b> Urban expansion is frequently presented as a visible sign of economic progress. New apartment blocks, wider roads and commercial centres can accommodate population growth and attract investment. Yet the speed at which a city adds physical structures does not necessarily show whether urban life is becoming more efficient. Housing, transport, employment and public services are interconnected, and development in one area can alter demand in another.</p><p><b>2.</b> Consider housing built on the urban fringe. Additional homes may reduce pressure in central districts, but their wider effect depends on where residents work and how they travel. If employment remains concentrated elsewhere and public transport is weak, households may rely more heavily on private vehicles. Road capacity can then become strained even though the housing project itself appears successful when judged only by the number of homes completed.</p><p><b>3.</b> Timing creates a similar difficulty. Residential construction may proceed faster than schools, clinics or transport links because these systems are financed and delivered through different processes. New residents can therefore arrive before supporting services are ready. Building all infrastructure in advance, however, is not a simple solution: future demand is uncertain, and unused capacity can be expensive. This dilemma forces planners to make decisions with incomplete information rather than waiting for perfect certainty.</p><p><b>4.</b> For that reason, some urban planners favour measures of accessibility and service capacity alongside conventional construction statistics. Instead of asking only how many kilometres of road or how many housing units have been added, they examine whether residents can reach jobs, education and healthcare within reasonable limits of time and cost. Such measures do not eliminate the trade-offs of urban growth, but they make those trade-offs more visible and therefore easier to manage.</p>", "READING 2": "<p><b>1.</b> Urban density is often treated as a simple number: the number of people living within a given area. This measure is useful, but by itself it cannot explain why two equally dense neighbourhoods may feel very different to residents. One may offer frequent public transport, nearby shops, schools and usable public spaces; another may contain the same number of people but require long journeys for basic services. Density describes concentration, not the quality of the connections within that concentration.</p><p><b>2.</b> Higher density can support certain urban advantages. When enough people live near a transport route, frequent service may become economically practical. Shops and public facilities can also serve more users within a shorter distance. However, these benefits depend on design and capacity. If housing grows without adequate transport, open space or utilities, concentration can instead intensify congestion and competition for limited services.</p><p><b>3.</b> Lower density is not automatically a solution. Spreading households across a wider area can reduce local crowding, yet it may increase the distance over which roads, water systems and other infrastructure must be provided. Residents may travel farther to work or school, making frequent public transport harder to operate efficiently. In this sense, reducing one kind of pressure can generate another.</p><p><b>4.</b> The debate therefore becomes misleading when density itself is labelled either good or bad. A more informative question is whether the pattern of development allows residents to reach daily needs without excessive cost, time or environmental burden. This shifts attention from density as an isolated statistic to how urban form functions in practice.</p><p><b>5.</b> For planners, the implication is not that every city should pursue the same density target. Local geography, existing infrastructure, housing demand and travel behaviour differ. What matters is the relationship among these factors. A dense district with strong transport and services may be highly liveable, while a less dense district can still perform poorly if basic destinations remain difficult to reach. Urban policy, in other words, must evaluate combinations rather than single indicators.</p>"};
