<title>4 • 4 — Ôn bài cũ • Luyện tập • Củng cố</title>
<style>:root{--navy:#17324d;--blue:#2563eb;--sky:#eaf3ff;--ink:#172033;--muted:#657087;--line:#d9e2ef;--green:#15803d;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:var(--ink);font:17px/1.65 "Times New Roman",Times,serif}
header{background:linear-gradient(135deg,#102a43,#245b8f);color:#fff;padding:30px 18px}
.wrap{max-width:1060px;margin:auto}
h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px)}.subtitle{opacity:.92;font-size:18px}
.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 14px #0f172a12}
.toolbar .wrap{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap;font-family:system-ui}
.timer{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;font-family:system-ui}
.primary{background:var(--blue);color:#fff}.ghost{background:#eef3f8;color:var(--navy)}.danger{background:#fee2e2;color:#991b1b}
main{padding:22px 14px 60px}
.part-head{margin:34px 0 14px;padding:16px 18px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#17324d,#2b6cb0)}
.part-head h2{margin:0;font-size:24px}.part-head p{margin:4px 0 0;opacity:.9}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:0 0 18px;box-shadow:0 7px 22px #1e293b0b}
.sec-title{margin:26px 0 12px;padding:12px 16px;border-left:6px solid var(--blue);background:var(--sky);border-radius:10px;font-size:20px}
.passage{background:#fbfdff;border:1px solid #bfd3ea;border-radius:14px;padding:16px 18px;margin:12px 0;text-align:justify}
.q{border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:12px 0;background:#fff}
.q.correct{border-color:#86efac;background:#f0fdf4}.q.incorrect{border-color:#fca5a5;background:#fff7f7}.q.nr{border-color:#fcd34d;background:#fffbeb}
.qnum{display:inline-flex;min-width:36px;height:28px;align-items:center;justify-content:center;border-radius:8px;background:#e8eef7;color:var(--navy);font-weight:800;margin-right:8px}
.prompt{font-weight:700}
.options{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:10px 12px;border-radius:10px;cursor:pointer;background:#fff}
.opt:hover{border-color:#7da7df;background:#f8fbff}.opt input{margin-top:5px}
.result{display:none}
.score-big{font-size:44px;font-weight:900;color:var(--navy)}
.badge{display:inline-block;border-radius:99px;padding:6px 14px;font-weight:800;font-family:system-ui;font-size:14px}
.GREEN{background:#dcfce7;color:var(--green)}.AMBER{background:#fef3c7;color:var(--amber)}.RED{background:#fee2e2;color:var(--red)}
.TAG{background:#e0e7ff;color:#3730a3}
.expl{margin-top:10px;padding:12px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
.expl b.hd{color:var(--navy)}
.kb{margin-top:8px;padding:10px 12px;background:#fffbeb;border-left:4px solid var(--amber);border-radius:8px}
.footer-note{color:var(--muted);font-size:14px}
table.vocab{width:100%;border-collapse:collapse;margin:12px 0}
table.vocab th{background:var(--navy);color:#fff;padding:10px 12px;text-align:left}
table.vocab td{border:1px solid var(--line);padding:9px 12px;vertical-align:top}
table.vocab tr:nth-child(even) td{background:#f8fafc}
.know{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:14px 16px;margin:12px 0}
.know b.t{color:var(--green)}
.modal{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.open{display:flex}.modal-box{background:#fff;border-radius:16px;max-width:540px;width:100%;padding:22px;font-family:system-ui}
@media(max-width:760px){.toolbar button{flex:1}}

#gate{position:fixed;inset:0;background:linear-gradient(135deg,#102a43,#245b8f);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.gate-box{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:30px 26px;text-align:center;box-shadow:0 20px 60px #0006}
.gate-box h2{color:var(--navy);margin:0 0 6px}
.gate-box input{width:100%;padding:12px;border:1px solid #bfcadd;border-radius:10px;font-size:17px;margin:12px 0;font-family:system-ui}
.gate-box .primary{width:100%;font-size:17px}
#pwmsg{color:var(--red);font-weight:700;min-height:24px;font-family:system-ui}
.view{display:none}.view.active{display:block}
.backbar{margin:0 0 12px}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:8px}
.hub-card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:22px 18px;cursor:pointer;text-align:left;font-family:"Times New Roman",Times,serif;box-shadow:0 7px 22px #1e293b0b}
.hub-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.hub-card b.t{font-size:21px;color:var(--navy);display:block;margin-bottom:6px}
.hub-card span.d{color:var(--muted);font-size:15px;display:block}
.hub-card .st{margin-top:10px;display:block}
.twopane{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;align-items:start;margin:12px 0}
.pane{max-height:74vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.pane-l{background:#fbfdff}
@media(max-width:860px){.twopane{grid-template-columns:1fr}.pane{max-height:none;overflow:visible}}

@media print{header,.toolbar,.actions{display:none!important}body{background:#fff}.card,.q{box-shadow:none;break-inside:avoid}}</style></head>

 that means \"xây dựng nhà cao tầng\".", "options": ["convert land into housing", "construct high-rise buildings", "meet residents’ needs", "expand public transport"], "keyLetter": "B", "keyText": "construct high-rise buildings", "why": "Cụm gốc của bài cho \"xây dựng nhà cao tầng\" là construct high-rise buildings.", "distractors": ["\"expand public transport\" là chunk khác trong bài.", "\"convert land into housing\" là chunk khác trong bài.", "\"meet residents’ needs\" là chunk khác trong bài."], "kb": "Chunk U4L4: construct high-rise buildings = xây dựng nhà cao tầng.", "authored": false}, {"n": 39, "uid": 39, "part": "", "hd_fix": false, "prompt": "Choose the source expression that means \"mở rộng / cải thiện đường sá\".", "options": ["widen / improve roads", "meet residents’ needs", "convert land into housing", "improve accessibility"], "keyLetter": "A", "keyText": "widen / improve roads", "why": "Cụm gốc của bài cho \"mở rộng / cải thiện đường sá\" là widen / improve roads.", "distractors": ["\"convert land into housing\" là chunk khác trong bài.", "\"meet residents’ needs\" là chunk khác trong bài.", "\"improve accessibility\" là chunk khác trong bài."], "kb": "Chunk U4L4: widen / improve roads = mở rộng / cải thiện đường sá.", "authored": false}, {"n": 40, "uid": 40, "part": "", "hd_fix": false, "prompt": "Choose the source expression that means \"mở rộng giao thông công cộng\".", "options": ["expand public transport", "ease / reduce congestion", "meet residents’ needs", "improve accessibility"], "keyLetter": "A", "keyText": "expand public transport", "why": "Cụm gốc của bài cho \"mở rộng giao thông công cộng\" là expand public transport.", "distractors": ["\"meet residents’ needs\" là chunk khác trong bài.", "\"improve accessibility\" là chunk khác trong bài.", "\"ease / reduce congestion\" là chunk khác trong bài."], "kb": "Chunk U4L4: expand public transport = mở rộng giao thông công cộng.", "authored": false}]},"p2":{"title":"PHẦN 2 — LUYỆN TẬP","desc":"19 câu: collocation • paraphrase an toàn • đọc hiểu (1 bài)","questions":[{"n": 1, "uid": 1, "part": "", "hd_fix": false, "prompt": "Several former industrial sites have been ______ into residential areas.", "options": ["converted", "removed for", "transferred at", "exchanged to"], "keyLetter": "A", "keyText": "converted", "why": "convert A into B = chuyển A thành B; sau be là phân từ: have been converted into residential areas.", "distractors": ["transferred at sai collocation với into housing.", "exchanged to sai collocation với into housing.", "removed for sai collocation với into housing."], "kb": "Collocation: convert A into B.", "authored": false}, {"n": 2, "uid": 2, "part": "", "hd_fix": false, "prompt": "The city has ______ its public transport network to serve outer districts.", "options": ["expanded", "raised up", "increased with", "grown it"], "keyLetter": "A", "keyText": "expanded", "why": "expand a public transport network = mở rộng mạng lưới giao thông công cộng.", "distractors": ["raised up không tự nhiên với network.", "grown it sai cấu trúc (grow là nội động từ ở nghĩa này).", "increased with sai giới từ đi kèm."], "kb": "Collocation: expand public transport.", "authored": false}, {"n": 3, "uid": 3, "part": "", "hd_fix": false, "prompt": "Wider access to reliable buses may help ______ congestion on major roads.", "options": ["decline", "ease", "drop down", "fall"], "keyLetter": "B", "keyText": "ease", "why": "ease congestion = làm giảm ùn tắc (ease là ngoại động từ đi trực tiếp với congestion).", "distractors": ["fall thường là nội động từ, không đi trực tiếp với congestion.", "decline thường là nội động từ, không đi trực tiếp với congestion.", "drop down không dùng như ngoại động từ với congestion."], "kb": "Collocation: ease / reduce congestion.", "authored": false}, {"n": 4, "uid": 4, "part": "", "hd_fix": false, "prompt": "Urban infrastructure needs to keep pace ______ population growth.", "options": ["at", "with", "for", "to"], "keyLetter": "B", "keyText": "with", "why": "keep pace with + N = theo kịp; giới từ cố định là WITH.", "distractors": ["to không đi với keep pace.", "for không đi với keep pace.", "at không đi với keep pace."], "kb": "Fixed preposition: keep pace WITH.", "authored": false}, {"n": 5, "uid": 5, "part": "", "hd_fix": false, "prompt": "New public facilities are intended to ______ the needs of local residents.", "options": ["take", "do", "make", "meet"], "keyLetter": "D", "keyText": "meet", "why": "meet residents’ needs = đáp ứng nhu cầu cư dân.", "distractors": ["take needs sai collocation.", "make needs sai collocation.", "do needs sai collocation."], "kb": "Collocation: meet residents’ needs.", "authored": false}, {"n": 6, "uid": 6, "part": "", "hd_fix": false, "prompt": "The redevelopment has improved residents’ quality ______ life in several respects.", "options": ["for", "to", "of", "with"], "keyLetter": "C", "keyText": "of", "why": "quality of life = chất lượng cuộc sống; cụm cố định.", "distractors": ["for không dùng trong cụm quality … life.", "to không dùng trong cụm quality … life.", "with không dùng trong cụm quality … life."], "kb": "Fixed phrase: quality of life.", "authored": false}, {"n": 7, "uid": 7, "part": "", "hd_fix": false, "prompt": "A new transport connection can improve ______ to employment and education.", "options": ["accessibly", "accessible", "access", "accessibility"], "keyLetter": "C", "keyText": "access", "why": "‘access’ là danh từ đi trực tiếp với to: improve access to employment and education.", "distractors": ["accessibility thường dùng trong improve accessibility, không kèm to theo mẫu câu này.", "accessible là tính từ, không đứng sau improve … to.", "accessibly là trạng từ, sai từ loại hoàn toàn."], "kb": "Chunk: improve access to.", "authored": false}, {"n": 8, "uid": 8, "part": "", "hd_fix": false, "prompt": "Rapid development may place additional ______ on schools, roads and healthcare.", "options": ["pressure", "stressful", "pressing", "pressured"], "keyLetter": "A", "keyText": "pressure", "why": "place additional pressure on = gây thêm áp lực lên; pressure là danh từ sau additional.", "distractors": ["stressful là tính từ, không đứng sau additional … on.", "pressing không phải danh từ cần cho cấu trúc này.", "pressured là tính từ, không đứng sau additional … on."], "kb": "Collocation: place additional pressure ON.", "authored": false}, {"n": 9, "uid": 9, "part": "", "hd_fix": false, "prompt": "Which option best restates: “The changes are not necessarily positive for everyone.”", "options": ["Every resident has experienced exactly the same effects from the changes.", "The changes may benefit some residents while providing little or no benefit to others.", "The changes have produced no positive outcomes for any local residents.", "Every resident benefits from the changes unless the neighbourhood becomes more crowded."], "keyLetter": "B", "keyText": "The changes may benefit some residents while providing little or no benefit to others.", "why": "‘not necessarily positive for everyone’ = không nhất thiết tích cực với tất cả → có thể lợi cho một số người nhưng ít/không lợi cho người khác.", "distractors": ["C. phủ định toàn bộ (no positive for any) trong khi gốc chỉ nói not necessarily.", "A. dùng every … exactly the same, tuyệt đối hoá trái với gốc.", "D. dùng every … unless, thêm điều kiện không có trong gốc."], "kb": "Paraphrase: giữ scope ‘not necessarily’, không tuyệt đối hoá.", "authored": false}, {"n": 10, "uid": 10, "part": "", "hd_fix": false, "prompt": "Which option best restates: “Better public transport has made the area easier to reach.”", "options": ["Improved transit has guaranteed shorter journeys for every resident.", "Improved transit has increased practical access to the area.", "The area became accessible only after all roads had been widened.", "Public transport has removed the need for residents to make long journeys."], "keyLetter": "B", "keyText": "Improved transit has increased practical access to the area.", "why": "‘made the area easier to reach’ ↔ increased practical access; giữ nguyên phạm vi ý nghĩa.", "distractors": ["D. thêm ‘removed the need for long journeys’ — tuyệt đối hoá.", "C. thêm điều kiện ‘only after all roads had been widened’ không có trong gốc.", "A. thêm ‘guaranteed … every resident’ — tuyệt đối hoá."], "kb": "Paraphrase: không thêm ý, không tuyệt đối hoá.", "authored": false}, {"n": 11, "uid": 11, "part": "", "hd_fix": false, "prompt": "Which option best restates: “The district has become more convenient, but congestion remains a problem.”", "options": ["Convenience can improve only after the district has solved all congestion.", "Traffic difficulties disappeared as soon as services became more convenient.", "Greater convenience has not eliminated the district’s traffic difficulties.", "The district became less convenient because congestion was completely removed."], "keyLetter": "C", "keyText": "Greater convenience has not eliminated the district’s traffic difficulties.", "why": "convenient tăng nhưng congestion remains → traffic difficulties chưa biến mất.", "distractors": ["D. đảo nghĩa (less convenient; completely removed trái với remains).", "B. nói difficulties disappeared, trái với remains a problem.", "A. biến thành điều kiện bắt buộc ‘only after … solved all’ không có trong gốc."], "kb": "Paraphrase: giữ cấu trúc ‘but … remains’.", "authored": false}, {"n": 12, "uid": 12, "part": "", "hd_fix": false, "prompt": "Which option best restates: “Urban development can transfer problems from one place to another.”", "options": ["Solving a difficulty in one location may create pressure elsewhere.", "Urban development normally creates exactly the same problem in every district.", "Moving a problem elsewhere always makes the original difficulty more serious.", "A local solution is effective only when it removes every urban problem."], "keyLetter": "A", "keyText": "Solving a difficulty in one location may create pressure elsewhere.", "why": "transfer problems from one place to another = giải quyết khó khăn ở nơi này có thể tạo áp lực nơi khác.", "distractors": ["B. dùng exactly the same … every district — tuyệt đối hoá.", "C. dùng always … more serious — thêm ý và tuyệt đối hoá.", "D. dùng every urban problem — tuyệt đối hoá."], "kb": "Paraphrase: transfer = move pressure elsewhere.", "authored": false}, {"n": 13, "uid": 13, "part": "READING 1", "hd_fix": false, "prompt": "What is the passage mainly about?", "options": ["District-level statistics are too inaccurate to provide any useful information about urban development.", "Urban projects should be rejected whenever they fail to provide identical benefits to every resident.", "Transport improvements are the main reason that commercial rents increase in redeveloped districts.", "Urban improvements should be evaluated by how benefits and costs are distributed, not by visible change alone."], "keyLetter": "D", "keyText": "Urban improvements should be evaluated by how benefits and costs are distributed, not by visible change alone.", "why": "Trích dẫn: “their effects are rarely identical for everyone” (đoạn 1) và “evaluation should identify who gains, who bears new costs” (đoạn 3) — toàn bài lập luận đánh giá dự án theo phân bố lợi ích/chi phí, không chỉ thay đổi bề ngoài.", "distractors": ["B. ‘should be rejected unless equal’ bị đoạn 3 bác bỏ trực tiếp.", "C. transport/rents quá hẹp, chỉ là một ví dụ.", "A. ‘too inaccurate/any useful’ quá tuyệt đối, trái với đoạn 3."], "kb": "Main idea: evaluate distribution, not visible change.", "authored": false}, {"n": 14, "uid": 14, "part": "READING 1", "hd_fix": false, "prompt": "Why does the writer mention commuters whose homes or workplaces remain poorly connected?", "options": ["To show that an improvement in average travel time may not represent every resident’s experience.", "To prove that commuters living outside a bus corridor should rely mainly on private vehicles.", "To argue that average journey time should never be used when evaluating public transport projects.", "To explain why transport projects normally increase journey times for residents outside city centres."], "keyLetter": "A", "keyText": "To show that an improvement in average travel time may not represent every resident’s experience.", "why": "Trích dẫn: “may greatly benefit commuters who travel along the improved route while doing little for residents whose homes or workplaces remain poorly connected” (đoạn 1) — ví dụ minh hoạ con số trung bình ≠ trải nghiệm của mọi người.", "distractors": ["B. private vehicles không hề được nhắc trong bài.", "D. ‘normally increase journey times’ đảo nghĩa của bài.", "C. ‘never use average’ quá tuyệt đối, bài chỉ yêu cầu bổ sung bằng chứng."], "kb": "Example function: average ≠ everyone’s experience.", "authored": false}, {"n": 15, "uid": 15, "part": "READING 1", "hd_fix": false, "prompt": "What can be inferred about new housing from paragraph 2?", "options": ["Additional housing always reduces rents for households already living in the district.", "Existing residents generally prefer new housing even when its price is beyond their financial reach.", "Increasing housing supply may have limited value for existing residents if the new homes are unaffordable to them.", "Housing pressure can be solved by increasing supply without considering the price of new units."], "keyLetter": "C", "keyText": "Increasing housing supply may have limited value for existing residents if the new homes are unaffordable to them.", "why": "Trích dẫn: “if most units are beyond the financial reach of existing residents, the project may do little to relieve their housing pressure” (đoạn 2) — thêm nguồn cung nhưng không đủ khả năng chi trả ⇒ giá trị hạn chế với cư dân hiện tại.", "distractors": ["A. ‘always reduces rents’ không được bài khẳng định.", "B. preference của cư dân không hề được nhắc.", "D. supply alone solves bị đoạn 2 bác bỏ."], "kb": "Inference: supply + unaffordable = limited value.", "authored": false}, {"n": 16, "uid": 16, "part": "READING 1", "hd_fix": false, "prompt": "The phrase conceal substantially different experiences in paragraph 2 is closest in meaning to ______.", "options": ["hide important differences in how groups are affected", "prove that district-wide improvements are experienced equally", "show that individual experience is more reliable than all statistics", "remove most differences among groups living in the same area"], "keyLetter": "A", "keyText": "hide important differences in how groups are affected", "why": "Trích dẫn: “an improvement measured at district level can conceal substantially different experiences within the district” (đoạn 2) — conceal = che giấu, hide.", "distractors": ["D. remove differences đảo nghĩa của conceal.", "B. prove equality đảo nghĩa của conceal.", "C. ‘more reliable than all statistics’ không được bài khẳng định."], "kb": "conceal = hide (vocab in context).", "authored": false}, {"n": 17, "uid": 17, "part": "READING 1", "hd_fix": false, "prompt": "Which statement is NOT supported by the passage?", "options": ["A project can perform well according to one measure while remaining limited according to another.", "A project that improves a district-wide average necessarily improves conditions for every subgroup.", "Evaluation can become more informative when average outcomes are examined across different groups.", "Small businesses may face higher rents after a commercial street becomes more attractive."], "keyLetter": "B", "keyText": "A project that improves a district-wide average necessarily improves conditions for every subgroup.", "why": "Trích dẫn: “their effects are rarely identical for everyone” (đoạn 1) — A khẳng định average tốt hơn ⇒ mọi nhóm đều tốt hơn, trái với toàn bài.", "distractors": ["D. được đoạn 2 khẳng định (higher visitor numbers can increase rents for small businesses).", "A. được đoạn 4 khẳng định (successful in one respect and limited in another).", "C. được đoạn 3 khẳng định."], "kb": "NOT supported: tìm đáp án trái với bài.", "authored": false}, {"n": 18, "uid": 18, "part": "READING 1", "hd_fix": true, "prompt": "What does This in “This requires evidence that goes beyond a single headline indicator” (paragraph 3) refer to?", "options": ["using average travel time as the only headline indicator", "making almost every form of urban development impossible", "rejecting projects unless every person receives an equal benefit", "identifying beneficiaries, new costs and possibilities for reducing those costs"], "keyLetter": "D", "keyText": "identifying beneficiaries, new costs and possibilities for reducing those costs", "why": "Trích dẫn: “Instead, evaluation should identify who gains, who bears new costs, and whether those costs can be reduced. This requires evidence that goes beyond a single headline indicator” (đoạn 3) — This = quá trình đánh giá nêu ở câu trước.", "distractors": ["C. là tiêu chuẩn bị bác ở câu đầu đoạn 3, không phải điều This thay thế.", "A. average travel time xuất hiện sau, không phải điều This thay thế.", "B. là hệ quả của tiêu chuẩn bị bác, không phải điều This thay thế."], "kb": "Reference: This = the evaluation just described.", "authored": false}, {"n": 19, "uid": 19, "part": "READING 1", "hd_fix": false, "prompt": "What is the function of the final paragraph?", "options": ["It introduces a new argument that construction projects should no longer be undertaken.", "It concludes that unequal outcomes are evidence that an urban project has completely failed.", "It generalises the examples into a broader principle for evaluating urban development.", "It narrows the discussion to the financial effects of redevelopment on small businesses."], "keyLetter": "C", "keyText": "It generalises the examples into a broader principle for evaluating urban development.", "why": "Trích dẫn: “The broader lesson is that urban development is not simply a collection of construction projects” (đoạn 4) — đoạn cuối khái e = chất lượng cuộc sống; cụm cố định.", "distractors": ["for không dùng trong cụm quality … life.", "to không dùng trong cụm quality … life.", "with không dùng trong cụm quality … life."], "kb": "quality of life.", "authored": false}, {"n": 12, "uid": 12, "part": "", "hd_fix": false, "prompt": "cải thiện khả năng tiếp cận → improve ______ to", "options": ["accessibility", "accessible", "accessibly", "access"], "keyLetter": "D", "keyText": "access", "why": "‘access’ là danh từ cần cho cấu trúc improve access to.", "distractors": ["accessibility thường dùng trong improve accessibility, không kèm to theo mẫu này.", "accessible là tính từ, sai từ loại.", "accessibly là trạng từ, sai từ loại."], "kb": "improve access TO.", "authored": false}, {"n": 13, "uid": 13, "part": "", "hd_fix": false, "prompt": "gây thêm áp lực lên → place additional pressure ______", "options": ["at", "for", "on", "in"], "keyLetter": "C", "keyText": "on", "why": "place additional pressure on = gây thêm áp lực lên; giới từ cố định ON.", "distractors": ["in không đi với place pressure …", "at không đi với place pressure …", "for không đi với place pressure …"], "kb": "place additional pressure ON.", "authored": false}, {"n": 14, "uid": 14, "part": "", "hd_fix": false, "prompt": "giảm ùn tắc → ______ congestion", "options": ["reduce", "decline", "drop down", "fall"], "keyLetter": "A", "keyText": "reduce", "why": "reduce congestion = giảm ùn tắc (ease cũng đúng nhưng không có trong các lựa chọn).", "distractors": ["fall thường là nội động từ, không đi trực tiếp với congestion.", "decline thường là nội động từ, không đi trực tiếp với congestion.", "drop down không dùng như ngoại động từ với congestion."], "kb": "ease / reduce congestion.", "authored": false}, {"n": 15, "uid": 15, "part": "", "hd_fix": false, "prompt": "kết quả không đồng đều → uneven ______", "options": ["incidents", "materials", "weather", "outcomes"], "keyLetter": "D", "keyText": "outcomes", "why": "produce uneven outcomes = tạo kế const PASSAGES={"READING 1": "<p><b>1.</b> Urban redevelopment is often presented through visible improvements: a new bus corridor, wider pavements, renovated public space or additional housing. Such changes can be valuable, but their effects are rarely identical for everyone. A transport project that reduces average journey time, for example, may greatly benefit commuters who travel along the improved route while doing little for residents whose homes or workplaces remain poorly connected.</p><p><b>2.</b> The distribution of costs can also differ. A redesigned commercial street may attract customers and make walking safer, yet higher visitor numbers can increase rents for small businesses. New housing may increase supply, but if most units are beyond the financial reach of existing residents, the project may do little to relieve their housing pressure. In each case, an improvement measured at district level can conceal substantially different experiences within the district.</p><p><b>3.</b> This does not mean that planners should reject projects unless every person gains equally. Such a standard would make almost any urban change impossible. Instead, evaluation should identify who gains, who bears new costs, and whether those costs can be reduced. This requires evidence that goes beyond a single headline indicator. Average travel time, for instance, becomes more informative when planners also examine differences among neighbourhoods, income groups or types of traveller.</p><p><b>4.</b> The broader lesson is that urban development is not simply a collection of construction projects. It is a process of changing access to space, services and opportunities. A project can therefore be successful in one respect and limited in another. Recognising this complexity does not weaken the case for urban improvement; rather, it helps decision-makers judge improvements more accurately and adjust them when benefits or burdens are distributed unevenly.</p>"};

const startEpoch=Date.now();
const letters=['A','B','C','D'];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nl2br(s){return esc(s).replace(/\n/g,'<br>')}
function paneKey(part){for(const k of Object.keys(PASSAGES)){if(part.indexOf(k)>-1)return k}return null}
function showView(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function unlock(){const v=document.getElementById('pw').value;if(v==='msPhuongcute'){document.getElementById('gate').style.display='none';showView('hub')}else{document.getElementById('pwmsg').textContent='Mật khẩu chưa đúng, em thử lại nhé.'}}
function renderPart(pid){
 const P=PARTS[pid],qs=P.questions;
 let out='<div class="backbar"><button class="ghost" onclick="showView(\'hub\')">← Về trang tổng</button></div>';
 out+='<div class="part-head"><h2>'+esc(P.title)+'</h2><p>'+esc(P.desc)+'</p></div>';
 out+='<div class="card"><div style="font-family:system-ui"><span class="timer">⏱ <span id="timer-'+pid+'">00:00</span></span> &nbsp;•&nbsp; <span id="count-'+pid+'">0/'+qs.length+' đã làm</span> <span style="display:inline-block;width:180px;height:9px;background:#e5eaf1;border-radius:99px;overflow:hidden;vertical-align:middle"><i id="bar-'+pid+'" style="display:block;height:100%;background:#2563eb;width:0%"></i></span></div></div>';
 let lastPart='',inPane=false;
 for(const q of qs){
  if(q.part!==lastPart){
   if(inPane){out+='</div></div>';inPane=false}
   out+='<h3 class="sec-title">'+esc(q.part)+'</h3>';lastPart=q.part;
   const pk=paneKey(q.part);
   if(pk&&pid==='p2'){out+='<div class="twopane"><div class="pane pane-l"><div class="passage">'+PASSAGES[pk]+'</div></div><div class="pane pane-r">';inPane=true}
  }
  out+='<article class="q" id="'+pid+'-qbox-'+(q.uid||q.n)+'"><div><span class="qnum">'+q.n+'</span><span class="prompt">'+q.prompt+'</span>'+(q.authored?' <span class="badge TAG">HĐ bổ sung</span>':'')+(q.hd_fix?' <span class="badge TAG">HĐ hiệu đính</span>':'')+'</div><div class="options">';
  q.options.forEach((o,i)=>{out+='<label class="opt"><input type="radio" name="'+pid+'-q'+(q.uid||q.n)+'" value="'+letters[i]+'"><b>'+letters[i]+'.</b><span>'+esc(o)+'</span></label>'});
  out+='</div></article>';
 }
 if(inPane)out+='</div></div>';
 out+='<section class="card actions"><button class="primary" style="font-size:18px;padding:14px 26px" onclick="confirmSubmit(\''+pid+'\')">NỘP BÀI PHẦN NÀY</button> <button class="ghost" onclick="saveDraft(\''+pid+'\',true)">Lưu nháp</button> <span id="state-'+pid+'" style="font-family:system-ui"></span></section>';
 out+='<section class="card result" id="result-'+pid+'"><h2>Kết quả '+esc(P.title)+'</h2><div id="summary-'+pid+'"></div><h3>Giải thích chi tiết từng câu</h3><p class="footer-note">✓ Đúng • ✕ Sai • — Chưa làm (NR)</p><div id="review-'+pid+'"></div><div style="margin-top:18px"><button class="danger" onclick="resetPart(\''+pid+'\')">Làm lại phần này</button></div></section>';
 document.getElementById('quiz-'+pid).innerHTML=out;
 document.querySelectorAll('#quiz-'+pid+' input').forEach(el=>el.addEventListener('input',()=>{updateProgress(pid);saveDraft(pid,false)}));
 restore(pid);updateProgress(pid);
}
function getAnswer(pid,q){const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"]:checked');return e?e.value:''}
function updateProgress(pid){const qs=PARTS[pid].questions,done=qs.filter(q=>getAnswer(pid,q)!=='').length;document.getElementById('count-'+pid).textContent=done+'/'+qs.length+' đã làm';document.getElementById('bar-'+pid).style.width=(done/qs.length*100)+'%'}
function tick(){const s=Math.floor((Date.now()-startEpoch)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');document.querySelectorAll('[id^="timer-"]').forEach(e=>e.textContent=m+':'+ss)}
function saveDraft(pid,show){if(SUBMITTED[pid])return;const a={};PARTS[pid].questions.forEach(q=>a[(q.uid||q.n)]=getAnswer(pid,q));try{localStorage.setItem('u4l4-'+pid,JSON.stringify(a))}catch(e){}if(show){const st=document.getElementById('state-'+pid);st.textContent='Đã lưu nháp.';setTimeout(()=>st.textContent='',2500)}}
function restore(pid){try{const d=JSON.parse(localStorage.getItem('u4l4-'+pid)||'null');if(!d)return;PARTS[pid].questions.forEach(q=>{const v=d[(q.uid||q.n)];if(!v)return;const e=document.querySelector('input[name="'+pid+'-q'+(q.uid||q.n)+'"][value="'+v+'"]');if(e)e.checked=true})}catch(e){}}
function confirmSubmit(pid){const qs=PARTS[pid].questions,blank=qs.filter(q=>!getAnswer(pid,q)).length;document.getElementById('modalText').textContent=blank?('Em còn '+blank+' câu chưa làm (sẽ ghi là NR). Nộp bài?'):('Em đã làm hết '+qs.length+' câu. Nộp bài?');PENDING=pid;document.getElementById('submitModal').classList.add('open')}
function closeModal(){document.getElementById('submitModal').classList.remove('open')}
function status(p){return p>=85?'GREEN':p>=70?'AMBER':'RED'}
function statusText(s){return s==='GREEN'?'Tốt — giữ vững bằng ôn tập giãn cách.':s==='AMBER'?'Cần củng cố thêm.':'Cần ôn lại ưu tiên.'}
function submitQuiz(){
 const pid=PENDING;closeModal();if(SUBMITTED[pid])return;SUBMITTED[pid]=true;
 const qs=PARTS[pid].questions;let score=0,nr=0,inc=0;const rows=[];
 for(const q of qs){const a=getAnswer(pid,q),ok=a!==''&&a===q.keyLetter;if(ok)score++;else if(a==='')nr++;else inc++;rows.push({q,a,ok})}
 const total=qs.length,pct=Math.round(score/total*1000)/10;
 const res=document.getElementById('result-'+pid);res.style.display='block';
 document.getElementById('summary-'+pid).innerHTML='<div class="score-big">'+score+' / '+total+'</div><p><span class="badge '+status(pct)+'">'+status(pct)+' — '+pct+'%</span></p><p><b>'+statusText(status(pct))+'</b></p><p>Đúng: <b>'+score+'</b> • Sai: <b>'+inc+'</b> • Chưa làm: <b>'+nr+'</b></p>';
 document.getElementById('review-'+pid).innerHTML=rows.map(r=>{
  const cls=r.ok?'correct':(r.a===''?'nr':'incorrect'),icon=r.ok?'✓':(r.a===''?'—':'✕');
  const ua=r.a?('<b>'+r.a+'.</b> '+esc(r.q.options[letters.indexOf(r.a)])):'—';
  return '<article class="q '+cls+'"><div><span class="qnum">'+r.q.n+'</span><b>'+icon+'</b> <span class="prompt">'+r.q.prompt+'</span></div>'
  +'<div style="margin-top:6px"><b>Bài làm của em:</b> '+ua+'</div>'
  +'<div><b>Đáp án đúng:</b> '+r.q.keyLetter+'. '+esc(r.q.keyText)+'</div>'
  +'<div class="expl"><b class="hd">Vì sao đúng:</b><br>'+nl2br(r.q.why)+'<br><br><b class="hd">Vì sao các đáp án khác sai:</b><br>'+r.q.distractors.map(d=>'• '+nl2br(d)).join('<br>')+'</div>'
  +'<div class="kb"><b>Kiến thức cần nhớ:</b> '+nl2br(r.q.kb)+'</div></article>'}).join('');
 document.querySelectorAll('#quiz-'+pid+' input').forEach(x=>x.disabled=true);
 try{localStorage.removeItem('u4l4-'+pid)}catch(e){}
 res.scrollIntoView({behavior:'smooth',block:'start'});
 const hs=document.getElementById('hubst-'+pid);if(hs)hs.innerHTML='<span class="badge '+status(pct)+'">Đã nộp: '+score+'/'+total+'</span>';
}
function resetPart(pid){if(confirm('Xóa bài làm phần này và bắt đầu lại?')){try{localStorage.removeItem('u4l4-'+pid)}catch(e){}location.reload()}}
let PENDING=null;const SUBMITTED={};
renderPart('p1');renderPart('p2');if(PARTS.p3)renderPart('p3');setInterval(tick,1000);tick();document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
